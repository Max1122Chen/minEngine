site_name: minEngine
site_description: 个人学习型 C++ 游戏引擎 — 公开技术手册
site_url: https://max1122chen.github.io/minEngine/
repo_url: https://github.com/Max1122Chen/minEngine
edit_uri: edit/master/docs/handbook/

docs_dir: docs/handbook

exclude_docs: |
  _authoring.md

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.prune
    - navigation.path
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - awesome-pages
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
      timezone: Asia/Shanghai
      locale: zh
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
